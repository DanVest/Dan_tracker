
<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Dan Tracker</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    main { max-width: 650px; margin: 20px auto; }
    h1 { font-size: 30px; }
    .muted { color: #cbd5e1; line-height: 1.5; }
    .card {
      padding: 18px;
      margin: 16px 0;
      border-radius: 14px;
      background: #1f2937;
    }
    button {
      padding: 12px 16px;
      border: 0;
      border-radius: 9px;
      background: #60a5fa;
      color: #111827;
      font-size: 16px;
      font-weight: 700;
    }
    .trade {
      padding: 14px 0;
      border-top: 1px solid #374151;
    }
    .trade h3 { margin: 0 0 8px; }
    .trade p { margin: 5px 0; }
    .buy { color: #86efac; }
    .sell { color: #fca5a5; }
    a { color: #93c5fd; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>Dan Tracker</h1>
  <p class="muted">Nancy Pelosi · Aktieovervågning</p>

  <section class="card">
    <h2>Aktiehandler</h2>
    <p id="status" class="muted">Henter indberettede handler ...</p>
    <button id="refresh">Opdater handler</button>
    <div id="trades"></div>
  </section>

  <section class="card">
    <h2>Notifikationer</h2>
    <p class="muted">
      Automatisk overvågning og push-notifikationer er endnu ikke sat op.
    </p>
    <button id="notify">Tillad notifikationer</button>
    <p id="notifyStatus" class="muted"></p>
  </section>

  <p class="muted">
    Datakilde:
    <a href="https://tracefour.com/congress/nancy-pelosi"
       target="_blank" rel="noopener noreferrer">Tracefour – Nancy Pelosi</a>.
    Handler kan være indberettet flere uger efter transaktionen.
  </p>
</main>

<script>
  const API =
    "https://tracefour.com/v1/congress/nancy-pelosi";

  const statusEl = document.getElementById("status");
  const tradesEl = document.getElementById("trades");

  function formatDate(value) {
    if (!value) return "Ukendt";
    const date = new Date(value + "T00:00:00");
    return Number.isNaN(date.getTime())
      ? value
      : date.toLocaleDateString("da-DK");
  }

  async function loadTrades() {
    statusEl.textContent = "Henter data ...";
    tradesEl.replaceChildren();

    try {
      const response = await fetch(API);

      if (!response.ok) {
        throw new Error("Datakilden svarede med fejl " + response.status);
      }

      const result = await response.json();
      const data = result.data;
      const trades = data && Array.isArray(data.trades)
        ? data.trades
        : [];

      if (trades.length === 0) {
        statusEl.textContent = "Ingen handler blev fundet.";
        return;
      }

      statusEl.textContent =
        trades.length + " indberettede handler fundet.";

      for (const trade of trades.slice(0, 25)) {
        const article = document.createElement("article");
        article.className = "trade";

        const title = document.createElement("h3");
        title.textContent =
          (trade.ticker || "Ukendt aktie") +
          " · " + (trade.type || "Ukendt type");
        title.className =
          trade.type === "Purchase" ? "buy" :
          trade.type === "Sale" ? "sell" : "";

        const details = document.createElement("p");
        details.textContent =
          (trade.assetDescription || trade.ticker || "Ukendt aktiv") +
          (trade.owner ? " · Ejer: " + trade.owner : "");

        const transactionDate = document.createElement("p");
        transactionDate.textContent =
          "Handelsdato: " + formatDate(trade.transactionDate);

        const disclosureDate = document.createElement("p");
        disclosureDate.textContent =
          "Indberettet: " + formatDate(trade.disclosureDate);

        const amount = document.createElement("p");
        amount.textContent =
          "Rapporteret beløb: " + (trade.amountLabel || "Ikke oplyst");

        article.append(title, details, transactionDate,
                       disclosureDate, amount);

        if (trade.sourceLink) {
          const link = document.createElement("a");
          link.href = trade.sourceLink;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Se original indberetning";
          article.append(link);
        }

        tradesEl.append(article);
      }
    } catch (error) {
      statusEl.textContent =
        "Kunne ikke hente data. Prøv igen senere. " + error.message;
    }
  }

  document.getElementById("refresh").addEventListener("click", loadTrades);

  document.getElementById("notify").addEventListener("click", async () => {
    const message = document.getElementById("notifyStatus");

    if (!("Notification" in window)) {
      message.textContent =
        "Denne browser understøtter ikke webnotifikationer.";
      return;
    }

    try {
      const permission = await Notification.requestPermission();
      message.textContent = permission === "granted"
        ? "Tilladelse givet. Automatiske push-notifikationer mangler stadig."
        : "Tilladelse blev ikke givet.";
    } catch {
      message.textContent =
        "Åbn appen via HTTPS for at anmode om tilladelse.";
    }
  });

  loadTrades();
</script>
</body>
</html>
